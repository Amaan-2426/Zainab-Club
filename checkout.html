<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ZAINAB CLUB</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="product.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">ZAINAB CLUB.</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#men">Men</a>
            <a href="index.html#jewellery">Jewellery</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <main class="cart-page">
        <h1>Checkout</h1>
        <p class="checkout-note">
            We collect delivery details here and save an unpaid order.
            Payment is not taken on this page.
        </p>

        <div id="checkout-summary"></div>

        <form id="checkout-form" class="checkout-form">
            <label>Full name
                <input name="name" type="text" required minlength="2" maxlength="80">
            </label>
            <label>Email
                <input name="email" type="email" required>
            </label>
            <label>Phone
                <input name="phone" type="tel" required>
            </label>
            <label>Address
                <input name="address_line1" type="text" required minlength="5">
            </label>
            <label>Address line 2 (optional)
                <input name="address_line2" type="text">
            </label>
            <label>City
                <input name="city" type="text" required>
            </label>
            <label>State
                <input name="state" type="text" required>
            </label>
            <label>PIN / postal code
                <input name="postal_code" type="text" required>
            </label>
            <label>Order notes (optional)
                <textarea name="notes" rows="3" maxlength="500"></textarea>
            </label>
            <button class="add-to-cart" type="submit">PLACE UNPAID ORDER</button>
        </form>

        <p id="checkout-message" aria-live="polite"></p>
        <a href="cart.html" class="continue-shopping">Back to cart</a>
    </main>

    <script src="js/api.js"></script>
    <script src="js/catalogue.js"></script>
    <script src="js/cart-store.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
